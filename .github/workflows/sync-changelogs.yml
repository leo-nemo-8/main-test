name: Sync changelogs to ReadMe

on:
  push:
    branches: [v2.0]
    paths: ["changelogs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-changelogs
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List changed changelog files
        id: changes
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            # Manual run or first push: sync every file present
            find changelogs -name '*.md' 2>/dev/null | sed 's/^/M\t/' > changes.txt || true
          else
            git diff --name-status --no-renames "$before" "${{ github.sha }}" -- changelogs/ > changes.txt
          fi
          cat changes.txt

      - name: Sync to ReadMe
        env:
          README_API_KEY: ${{ secrets.README_API_KEY }}
        run: python3 .github/scripts/sync_changelogs.py < changes.txt
